name: WxPusher Notify

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SUPABASE_URL: https://rhkzsyhxezlppfxqzalm.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_jg7Ht5A1SXFfkn4VZImQKA_eAHoh5uZ
      SUPABASE_TABLE: balance_state
      SUPABASE_ROW_ID: china_broadcasting
      WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
      WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Run notification worker
        run: node scripts/wxpusher-notify.mjs
